<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Campus Lost & Found{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.0.6/css/pico.min.css">
  <style>
    .grid-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; }
    .grid-items img { width: 100%; height: 160px; object-fit: cover; border-radius: 6px; }
    .flash.error { border-left: 4px solid #d33; }
    .flash.success { border-left: 4px solid #2a2; }
  </style>
</head>
<body>
  <nav class="container">
    <ul><li><a href="/"><strong>🔎 Lost & Found</strong></a></li></ul>
    <ul>
      {% if g.user %}
        <li><a href="/items/new">Post item</a></li>
        <li><a href="/users/{{ g.user['username'] }}">{{ g.user['username'] }}</a></li>
        <li><a href="/logout">Log out</a></li>
      {% else %}
        <li><a href="/login">Log in</a></li>
        <li><a href="/register">Register</a></li>
      {% endif %}
    </ul>
  </nav>
  <main class="container">
    {% for cat, msg in get_flashed_messages(with_categories=true) %}
      <article class="flash {{ cat }}">{{ msg }}</article>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
