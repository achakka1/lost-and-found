{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<form method="post">
  <label>Username <input name="username" required value="{{ request.form.username }}"></label>
  <label>Password <input type="password" name="password" required></label>
  <button type="submit">{{ title }}</button>
</form>
{% endblock %}
